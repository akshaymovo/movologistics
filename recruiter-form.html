<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RECRUITER PARTNER APPLICATION FORM</title>

<style>
/* Base Reset & Variables */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

:root {
    --primary-color: #0052cc;
    --primary-hover: #0043a4;
    --text-color: #2d3748;
    --text-light: #718096;
    --bg-color: #f7fafc;
    --card-bg: #ffffff;
    --border-color: #cbd5e1;
    --border-radius: 12px;
    --transition: all 0.3s ease;
}

body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    line-height: 1.6;
    padding: 30px 15px;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

/* Container Design */
.container {
    max-width: 750px;
    width: 100%;
    background: var(--card-bg);
    padding: 40px 30px;
    border-radius: var(--border-radius);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
}

/* Typography & Layout Headings */
h1 {
    font-size: 1.8rem;
    color: #1a202c;
    text-align: center;
    margin-bottom: 35px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    position: relative;
    padding-bottom: 15px;
}

h1::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 4px;
    background: var(--primary-color);
    border-radius: 2px;
}

h2 {
    font-size: 1.1rem;
    color: var(--primary-color);
    margin-top: 35px;
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    border-bottom: 2px solid #edf2f7;
    padding-bottom: 8px;
}

/* Responsive Form Grid Layout */
.form-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 5px 20px;
}

.full-width {
    grid-column: 1 / -1;
}

/* Inputs & Form Elements */
label {
    display: block;
    margin-top: 15px;
    font-weight: 600;
    font-size: 0.85rem;
    color: #4a5568;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

input[type="text"],
input[type="tel"],
input[type="email"],
select {
    width: 100%;
    padding: 12px 16px;
    margin: 6px 0 16px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--text-color);
    background-color: #fff;
    transition: var(--transition);
}

input:focus,
select:focus {
    outline: none;
    border-color: var(--primary-color);
    box-shadow: 0 0 0 3px rgba(0, 82, 204, 0.15);
}

/* Checkbox Blocks */
.checkbox-label {
    display: flex;
    align-items: flex-start;
    margin-top: 12px;
    font-weight: normal;
    font-size: 0.95rem;
    color: var(--text-color);
    text-transform: none;
    letter-spacing: normal;
    cursor: pointer;
}

.checkbox-label input[type="checkbox"] {
    margin-right: 12px;
    margin-top: 5px;
    width: 16px;
    height: 16px;
    accent-color: var(--primary-color);
}

/* Form Actions Button */
.btn-wrapper {
    text-align: center;
    margin-top: 35px;
}

button {
    width: 100%;
    padding: 14px 35px;
    border: none;
    border-radius: 8px;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: #718096;
    background: #e2e8f0;
    cursor: not-allowed;
    transition: var(--transition);
}

button.active {
    background: var(--primary-color);
    color: white;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(0, 82, 204, 0.2);
}

button.active:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(0, 82, 204, 0.3);
}

button.active:active {
    transform: translateY(0);
}

.home-btn {
    display: inline-block;
    margin-bottom: 15px;
    color: var(--text-light);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 600;
}
.home-btn:hover {
    color: var(--primary-color);
}

/* Responsive Adaptive Viewports */
@media (min-width: 576px) {
    .form-grid {
        grid-template-columns: 1fr 1fr;
    }
    button {
        width: auto;
    }
}

@media (max-width: 576px) {
    body {
        padding: 10px;
    }
    
    .container {
        padding: 30px 20px;
        border-radius: var(--border-radius);
    }

    h1 {
        font-size: 1.5rem;
    }
}
</style>

</head>

<body>

<div class="container">

<h1>RECRUITER PARTNER APPLICATION FORM</h1>

<form id="myForm">

<div class="form-grid">

<h2 class="full-width">PERSONAL DETAILS</h2>

<div class="full-width">
<label>FULL NAME</label>
<input type="text" id="fullName" name="fullName" maxlength="25" pattern="[A-Za-z ]+" required>
</div>

<div>
<label>MOBILE NUMBER</label>
<input type="tel" id="mobileNumber" name="mobileNumber" maxlength="10" pattern="[0-9]{10}" required>
</div>

<div>
<label>EMAIL ADDRESS</label>
<input type="email" id="email" name="email" required>
</div>

<div class="form-group">
  <label>CITY</label>
  <select id="city" name="city" required>
    <option value="">Select City</option>
  </select>
</div>

<h2 class="full-width">RECRUITMENT DETAILS</h2>

<div>
<label>HAVE YOU WORKED IN RECRUITMENT BEFORE?</label>
<select name="experience" id="experience">
<option value="YES">YES</option>
<option value="NO">NO</option>
</select>
</div>

<div id="previousCompanyBox">
<label>PREVIOUS COMPANY / PLATFORM NAME</label>
<input type="text" name="previousCompany" id="previousCompany">
</div>

<div class="full-width">
<label>HOW MANY DELIVERY PARTNERS CAN YOU ONBOARD MONTHLY?</label>
<select name="monthlyRiderCapacity" id="monthlyRiderCapacity">
<option value="1-10">1-10</option>
<option value="11-50">11-50</option>
<option value="51+">51+</option>
</select>
</div>

<h2 class="full-width">WORK PREFERENCE</h2>

<div>
<label>PREFERRED WORK TYPE</label>
<select name="workType" id="workType">
<option value="WORK FROM HOME">WORK FROM HOME</option>
<option value="FIELD WORK">FIELD WORK</option>
<option value="BOTH">BOTH</option>
</select>
</div>

<div>
<label>DO YOU HAVE SMARTPHONE & INTERNET?</label>
<select name="smartphone" id="smartphone">
<option value="YES">YES</option>
<option value="NO">NO</option>
</select>
</div>

<h2 class="full-width">BANK DETAILS</h2>

<div>
<label>ACCOUNT HOLDER NAME</label>
<input type="text" id="bankHolderName" name="bankHolderName" maxlength="40" pattern="[A-Za-z ]+" required>
</div>

<div>
<label>BANK NAME</label>
<input type="text" id="bankName" name="bankName" maxlength="40" pattern="[A-Za-z ]+" required>
</div>

<div class="full-width">
<label>ACCOUNT NUMBER</label>
<input type="text" id="accountNumber" name="accountNumber" maxlength="25" pattern="[0-9]+" required>
</div>

<div class="full-width">
<label>IFSC CODE</label>
<input type="text" id="ifscCode" name="ifscCode" maxlength="11" required>
</div>

<h2 class="full-width">CONFIRMATION</h2>

<div class="full-width">
<label class="checkbox-label">
<input type="checkbox" id="termsCheck">
I have read and understood the Recruiter Partner Program details.
</label>
</div>

<div class="full-width">
<label class="checkbox-label">
<input type="checkbox" id="guidelineCheck">
I agree to follow company guidelines and onboard genuine Delivery Partners only.
</label>
</div>

</div>

<div class="btn-wrapper">
<a href="movo.html" class="home-btn">BACK TO HOME</a>
<button type="submit" id="submitBtn" disabled>SUBMIT APPLICATION</button>
</div>

</form>

</div>

<script>
// SHOW / HIDE PREVIOUS COMPANY
const experience = document.getElementById("experience");
const previousCompanyBox = document.getElementById("previousCompanyBox");
const previousCompany = document.getElementById("previousCompany");

experience.addEventListener("change", function(){
    if(this.value === "NO"){
        previousCompanyBox.style.display = "none";
        previousCompany.value = "";
    } else {
        previousCompanyBox.style.display = "block";
    }
});

// CHECKBOX BUTTON ENABLE
const termsCheck = document.getElementById("termsCheck");
const guidelineCheck = document.getElementById("guidelineCheck");
const submitBtn = document.getElementById("submitBtn");

function checkAgreement(){
    if(termsCheck.checked && guidelineCheck.checked){
        submitBtn.disabled = false;
        submitBtn.classList.add("active");
    } else {
        submitBtn.disabled = true;
        submitBtn.classList.remove("active");
    }
}

termsCheck.addEventListener("change", checkAgreement);
guidelineCheck.addEventListener("change", checkAgreement);

// APPS SCRIPT CONNECTION & SUBMISSION
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbxnHDIM6gkJJ7G2MRMN-x-D2n91-Cqt8eIgS3Lw83ANGuXyeAvCuPH-qSDPeLY-zHanSw/exec";


 // Google Script se cities fetch karna
  fetch(WEB_APP_URL + "?action=getCities")
    .then(response => response.json())
    .then(data => {
      if (data.success && data.cities) {
        const citySelect = document.getElementById("city");
        
        // Purane options clear karke naye add karna
        data.cities.forEach(cityName => {
          let option = document.createElement("option");
          option.value = cityName;
          option.textContent = cityName;
          citySelect.appendChild(option);
        });
      }
    })
document.getElementById("myForm").addEventListener("submit", function(e) {
  e.preventDefault();

  const submitButton = document.getElementById("submitBtn");
  submitButton.disabled = true;
  submitButton.textContent = "Submitting...";

  const formData = {
    fullName: document.getElementById("fullName").value,
    mobileNumber: document.getElementById("mobileNumber").value,
    email: document.getElementById("email").value,
    city: document.getElementById("city").value,
    experience: document.getElementById("experience").value,
    previousCompany: document.getElementById("previousCompany").value,
    monthlyRiderCapacity: document.getElementById("monthlyRiderCapacity").value,
    workType: document.getElementById("workType").value,
    smartphone: document.getElementById("smartphone").value,
    bankHolderName: document.getElementById("bankHolderName").value,
    bankName: document.getElementById("bankName").value,
    accountNumber: document.getElementById("accountNumber").value,
    ifscCode: document.getElementById("ifscCode").value
  };

  fetch(WEB_APP_URL, {
    method: "POST",
    body: JSON.stringify(formData)
  })
  .then(response => response.json())
  .then(data => {
    submitButton.disabled = false;
    submitButton.textContent = "SUBMIT APPLICATION";

    if (data.success) {
      alert("Application Submitted Successfully! ID: " + data.applicationId);
      document.getElementById("myForm").reset();
      submitBtn.classList.remove("active");
      submitBtn.disabled = true;
    } else {
      alert("Error: " + data.message);
    }
  })
  .catch(error => {
    submitButton.disabled = false;
    submitButton.textContent = "SUBMIT APPLICATION";
    console.error("Error:", error);
    alert("Something went wrong. Please try again.");
  });
});

</script>

</body>
</html>
