<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vacancies Not Available - Movo Logistics</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f9fd;
            text-align: center;
            padding: 20px;
        }

        .message-box {
            background: white;
            padding: 50px 35px;
            border-radius: 20px;
            max-width: 550px;
            width: 100%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #0f172a;
            font-size: 28px;
            margin-bottom: 15px;
        }

        p {
            color: #64748b;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            background: #0284c7;
            color: white;
            padding: 12px 28px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn:hover {
            background: #0369a1;
        }
    </style>
</head>

<body>

    <div class="message-box">

        <div class="icon">📢</div>

        <h1>Sorry!</h1>

        <p>
            Currently, vacancies are not available.
            Please check back later for new opportunities.
        </p>

        <a href="movo.html" class="btn">Back to Home</a>

    </div>

</body>
</html>
